.cooking-mode{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column}

.step-card{background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);border-radius:20px;padding:24px;margin:16px}

.sub-tab{padding:8px 20px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;transition:all 0.2s}
.sub-tab.active{background:#ff964f;color:#fff}
.sub-tab:not(.active){background:#fff3e8;color:#ff964f}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 24px;border-radius:12px;z-index:300;font-size:14px;animation:fadeInOut 2.5s ease}
@keyframes fadeInOut{0%{opacity:0;transform:translateX(-50%) translateY(-10px)}10%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0}}
input,textarea,select{font-family:'DM Sans',sans-serif}
.star{cursor:pointer;transition:transform 0.15s}
.star:hover{transform:scale(1.2)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#ffd4b0;border-radius:4px}
</style>

  <script>

// ===== CONFIG =====
const defaultConfig = {
  app_title: 'MakeMe',
  tagline: 'Cook. Share. Discover.',
  background_color: '#fef7f0',
  surface_color: '#ffffff',
  text_color: '#2d2017',

// ===== ELEMENT SDK =====
window.elementSdk.init({
  defaultConfig,
  onConfigChange: async (config) => {
    const bg = config.background_color || defaultConfig.background_color;
    const surface = config.surface_color || defaultConfig.surface_color;
    const text = config.text_color || defaultConfig.text_color;
    const primary = config.primary_action_color || defaultConfig.primary_action_color;
    const secondary = config.secondary_action_color || defaultConfig.secondary_action_color;
    const font = config.font_family || defaultConfig.font_family;
    const size = config.font_size || defaultConfig.font_size;

    document.querySelector('.app-shell').style.background = bg;
    document.body.style.fontFamily = `${font}, DM Sans, sans-serif`;
    document.body.style.fontSize = size + 'px';
    document.body.style.color = text;

    document.querySelectorAll('.recipe-card').forEach(c => c.style.background = surface);
    document.querySelectorAll('.bg-accent').forEach(e => e.style.background = primary);
    document.querySelectorAll('.accent').forEach(e => e.style.color = primary);
    document.querySelectorAll('.sub-tab.active').forEach(e => e.style.background = primary);

    const titleEl = document.getElementById('home-title');
    if(titleEl) titleEl.textContent = config.app_title || defaultConfig.app_title;
    const tagEl = document.getElementById('home-tagline');
    if(tagEl) tagEl.textContent = config.tagline || defaultConfig.tagline;
  },
  mapToCapabilities: (config) => ({
    recolorables: [
      {get:()=>config.background_color||defaultConfig.background_color,set:v=>{config.background_color=v;window.elementSdk.setConfig({background_color:v})}},
      {get:()=>config.surface_color||defaultConfig.surface_color,set:v=>{config.surface_color=v;window.elementSdk.setConfig({surface_color:v})}},
      {get:()=>config.text_color||defaultConfig.text_color,set:v=>{config.text_color=v;window.elementSdk.setConfig({text_color:v})}},
      {get:()=>config.primary_action_color||defaultConfig.primary_action_color,set:v=>{config.primary_action_color=v;window.elementSdk.setConfig({primary_action_color:v})}},
      {get:()=>config.secondary_action_color||defaultConfig.secondary_action_color,set:v=>{config.secondary_action_color=v;window.elementSdk.setConfig({secondary_action_color:v})}}
    ],
    borderables: [],
    fontEditable: {get:()=>config.font_family||defaultConfig.font_family,set:v=>{config.font_family=v;window.elementSdk.setConfig({font_family:v})}},
    fontSizeable: {get:()=>config.font_size||defaultConfig.font_size,set:v=>{config.font_size=v;window.elementSdk.setConfig({font_size:v})}}
  }),
  mapToEditPanelValues: (config) => new Map([
    ['app_title', config.app_title || defaultConfig.app_title],
    ['tagline', config.tagline || defaultConfig.tagline]
  ])
});

// ===== DATA SDK =====
const dataHandler = {
  onDataChanged(data) {
    // Separate recipes from user profiles
    const recipes = data.filter(d => d.type === 'recipe');
    const users = data.filter(d => d.type === 'user');
    
    allRecipes = recipes;
    allUsers = users;
    
    if(isLoggedIn && currentUser) {
      renderCurrentTab();
    }
  }
};

(async()=>{
  const r = await window.dataSdk.init(dataHandler);
  if(!r.isOk) console.error('Data SDK init failed');
  
  // Check for existing user in localStorage
  const savedUserId = localStorage.getItem('makeme_user_id');
  if(savedUserId) {
    const user = allUsers.find(u => u.__backendId === savedUserId);
    if(user) {
      currentUser = user;
      isLoggedIn = true;
      renderCurrentTab();
    } else {
      showLoginScreen();
    }
  } else {
    showLoginScreen();
  }
})();

// ===== HELPERS =====
function showToast(msg) {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}

function getUserRecipes() { 
  return allRecipes.filter(r=> r.type==='recipe' && r.author === (currentUser?.user_name || 'You')); 
}

function getPublishedRecipes() { 
  return allRecipes.filter(r => r.type==='recipe' && r.published); 
}

function timeAgo(iso) {
  if(!iso) return '';
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diff/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins+'m ago';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs+'h ago';
  return Math.floor(hrs/24)+'d ago';
}

// ===== TAB SWITCHING =====
function switchTab(tab) {
  if(!isLoggedIn) return;
  currentTab = tab;
  document.querySelectorAll('.nav-btn').forEach(b => {
    const isActive = b.dataset.tab === tab;
    b.style.color = isActive ? '#ff964f' : '#999';
  });
  renderCurrentTab();
}

function renderCurrentTab() {
  if(!isLoggedIn || !currentUser) {
    showLoginScreen();
    return;
  }
  const el = document.getElementById('tab-content');
  switch(currentTab) {
    case 'home': renderHome(el); break;
    case 'my-recipes': renderMyRecipes(el); break;
    case 'feed': renderFeed(el); break;
    case 'profile': renderProfile(el); break;
  }
  lucide.createIcons();
}

// ===== LOGIN SCREEN =====

  const el = document.getElementById('tab-content');
  el.innerHTML = `

      <div style="width:100%;max-width:400px">
        <div style="background:#fff;border-radius:16px;padding:30px;box-shadow:0 2px 12px rgba(255,150,79,0.08)">
          <h2 style="font-size:18px;font-weight:bold;margin-bottom:20px">Welcome to MakeMe</h2>
          
          <button onclick="showNewUserForm()" style="width:100%;padding:14px;background:linear-gradient(135deg,#ff964f,#ff6b2b);color:#fff;border:none;border-radius:12px;font-weight:bold;font-size:16px;margin-bottom:12px;cursor:pointer">Create Account</button>
          
          <div style="text-align:center;margin:16px 0;opacity:0.4">or</div>
          
          <button onclick="showLoginForm()" style="width:100%;padding:14px;background:#fff3e8;color:#ff964f;border:2px solid #ff964f;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer">Login</button>
          
          <p style="font-size:12px;opacity:0.5;margin-top:20px">Your account is private and secure in MakeMe</p>
        </div>
      </div>
    </div>
  `;
}

function showNewUserForm() {
  const el = document.getElementById('tab-content');
  el.innerHTML = `
    <div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px">
      <button onclick="showLoginScreen()" style="align-self:flex-start;width:40px;height:40px;border-radius:50%;background:#f0f0f0;border:none;font-size:20px;cursor:pointer;margin-bottom:20px">←</button>
      
      <div style="width:100%;max-width:400px">
        <div style="background:#fff;border-radius:16px;padding:30px;box-shadow:0 2px 12px rgba(255,150,79,0.08)">
          <h2 style="font-size:20px;font-weight:bold;margin-bottom:25px;font-family:'Playfair Display',serif">Create Your Account</h2>
          
          <label style="display:block;font-weight:600;font-size:14px;margin-bottom:8px">Username</label>
          <input id="new-username" type="text" placeholder="Choose a username" style="width:100%;padding:12px;border:2px solid #f0f0f0;border-radius:10px;font-size:14px;margin-bottom:16px;font-family:inherit;box-sizing:border-box" />
          
          <label style="display:block;font-weight:600;font-size:14px;margin-bottom:8px">4-Digit PIN</label>

          <button onclick="createNewUser()" style="width:100%;padding:14px;background:linear-gradient(135deg,#ff964f,#ff6b2b);color:#fff;border:none;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer;margin-bottom:12px">Create Account</button>
          
          <p id="new-error" style="color:#d32f2f;font-size:12px;margin-top:12px;display:none"></p>
        </div>
      </div>

function showLoginForm() {
  const el = document.getElementById('tab-content');
  el.innerHTML = `
    <div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px">
      <button onclick="showLoginScreen()" style="align-self:flex-start;width:40px;height:40px;border-radius:50%;background:#f0f0f0;border:none;font-size:20px;cursor:pointer;margin-bottom:20px">←</button>
      
      <div style="width:100%;max-width:400px">

}

async function createNewUser() {
  const username = document.getElementById('new-username').value.trim();
  const pin = document.getElementById('new-pin').value.trim();
  const tier = document.getElementById('new-tier').value;
  const errEl = document.getElementById('new-error');
  
  if(!username) { errEl.textContent = 'Username is required'; errEl.style.display = 'block'; return; }
  if(username.length < 3) { errEl.textContent = 'Username must be at least 3 characters'; errEl.style.display = 'block'; return; }
  if(!/^\d{4}$/.test(pin)) { errEl.textContent = 'PIN must be exactly 4 digits'; errEl.style.display = 'block'; return; }
  
  // Check if username already exists
  if(allUsers.find(u => u.user_name === username)) {
    errEl.textContent = 'Username already taken'; 
    errEl.style.display = 'block'; 
    return;
  }
  
  const userData = {
    type: 'user',
    user_name: username,
    user_pin: pin,
    user_tier: tier,
    user_avatar_url: DEFAULT_AVATAR,
    user_restaurant: '',
    user_food_type: '',
    created_at: new Date().toISOString()
  };
  
  const result = await window.dataSdk.create(userData);
  if(result.isOk) {
    showToast('Account created! Logging in...');
    // Wait for data update then login
    setTimeout(() => {
      const newUser = allUsers.find(u => u.user_name === username && u.user_pin === pin);
      if(newUser) {
        currentUser = newUser;
        isLoggedIn = true;
        localStorage.setItem('makeme_user_id', newUser.__backendId);
        currentTab = 'home';
        renderCurrentTab();
      }
    }, 500);
  } else {
    errEl.textContent = 'Failed to create account';
    errEl.style.display = 'block';
  }
}

function loginUser() {
  const username = document.getElementById('login-username').value.trim();
  const pin = document.getElementById('login-pin').value.trim();
  const errEl = document.getElementById('login-error');
  
  if(!username || !pin) { errEl.textContent = 'Username and PIN required'; errEl.style.display = 'block'; return; }
  
  const user = allUsers.find(u => u.user_name === username && u.user_pin === pin);
  if(!user) { errEl.textContent = 'Invalid username or PIN'; errEl.style.display = 'block'; return; }
  
  currentUser = user;
  isLoggedIn = true;
  localStorage.setItem('makeme_user_id', user.__backendId);
  currentTab = 'home';
  showToast('Welcome back!');
  renderCurrentTab();
}

function logout() {
  currentUser = null;
  isLoggedIn = false;
  localStorage.removeItem('makeme_user_id');
  showLoginScreen();
}
function renderHome(el) {

            <div class="p-3">
              <p class="font-bold text-sm truncate">${r.title}</p>
              <p class="text-xs opacity-50 mt-1">${r.cook_time} min • ${r.category}</p>
            </div>
          </div>
        `).join('')}
      </div>` : ''}

      ${published.length > 0 ? `
      <h2 class="font-bold text-lg mb-3 mt-4" style="font-family:'Playfair Display',serif">Your Published</h2>
      <div class="flex gap-3 overflow-x-auto pb-3" style="scrollbar-width:none">
        ${published.map(r=>`
          <div class="recipe-card flex-shrink-0" style="width:180px" onclick="openRecipeDetail('${r.__backendId}')">
            <div style="width:100%;height:140px;display:flex;align-items:center;justify-content:center;font-size:64px;background:linear-gradient(135deg,#fff3e8,#ffe8d4)"><img src="${r.image_url||DEFAULT_AVATAR}" alt="recipe" style="width:100%;height:100%;object-fit:cover" /></div>
            <div class="p-3">
              <p class="font-bold text-sm truncate">${r.title}</p>
              <p class="text-xs opacity-50 mt-1">Rating: ${r.rating||'—'}</p>

function filterFeed() {
  const q = document.getElementById('feed-search').value.toLowerCase();
  const allFeed = getPublishedRecipes();
  const source = feedSubTab === 'expert' ? allFeed.filter(r=>r.author_tier==='expert') : allFeed.filter(r=> r.author_tier !== 'expert');
  const filtered = q ? source.filter(r => {
    const searchable = `${r.title} ${r.description||''} ${r.keywords||''} ${r.category||''} ${r.ingredients||''} ${r.author}`.toLowerCase();
    return searchable.includes(q);
  }) : source;
  document.getElementById('feed-list').innerHTML = renderFeedList(filtered);
  lucide.createIcons();
}

async function saveProfileSettings() {
  const newName = document.getElementById('prof-name').value.trim();
  if(newName.length < 2) { showToast('Name must be at least 2 characters'); return; }
  currentUser.user_name = newName;
  
  const result = await window.dataSdk.update(currentUser);
  if(result.isOk) {
    showToast('Profile updated!');
    renderProfile(document.getElementById('tab-content'));
  } else {
    showToast('Failed to update profile');
  }
}

async function saveAllSettings() {
  currentUser.show_followers = document.getElementById('show-followers').checked;

  const result = await window.dataSdk.update(currentUser);

async function changeTier() {
  const tier = document.getElementById('tier-select').value;
  currentUser.user_tier = tier;
  const result = await window.dataSdk.update(currentUser);
  if(result.isOk) {
    showToast(`Changed to ${tier} account`);
  }
}

async function changeVoice(voice) {
  currentUser.voice = voice;
  const result = await window.dataSdk.update(currentUser);
  if(result.isOk) {
    showToast('Voice updated!');
    // Test the voice
    const SR = window.SpeechSynthesisUtterance;
    if(SR) {
      const utt = new SR(`Hello. I'm MakeMe`);
      const parts = voice.split('-');
      const gender = parts[0];
      const accent = parts[1];
      let lang = 'en-US';
      if(accent==='british') lang = 'en-GB';
      if(accent==='australian') lang = 'en-AU';
      utt.lang = lang;
      utt.pitch = gender === 'female' ? 1.1 : 0.9;
      utt.rate = 0.9;
      if(window.speechSynthesis) window.speechSynthesis.speak(utt);
    }
    openSettings();
  }
}

async function doDeleteAccount() {
  // Delete all user recipes
  const userRecipes = allRecipes.filter(r => r.author === currentUser.user_name);
  for(let recipe of userRecipes) {
    await window.dataSdk.delete(recipe);
  }
  
  // Delete the user account
  const result = await window.dataSdk.delete(currentUser);
  if(result.isOk) {
    showToast('Account deleted');
    logout();
  } else {
    showToast('Failed to delete account');
  }
}

async function toggleFollow(userId) {
  const targetUser = allUsers.find(u => u.__backendId === userId);
  if(!targetUser) return;
  
  const followers = JSON.parse(targetUser.followers || '[]');
  if(followers.includes(currentUser.user_name)) {
    followers.splice(followers.indexOf(currentUser.user_name), 1);
  } else {
    followers.push(currentUser.user_name);
  }
  targetUser.followers = JSON.stringify(followers);
  
  const result = await window.dataSdk.update(targetUser);
  if(result.isOk) {
    showToast(followers.includes(currentUser.user_name) ? 'Following!' : 'Unfollowed');
    renderProfile(document.getElementById('tab-content'));
  }
}

async function toggleFriend(userId) {
  const targetUser = allUsers.find(u => u.__backendId === userId);
  if(!targetUser) return;
  
  const friends = JSON.parse(targetUser.friends || '[]');
  if(friends.includes(currentUser.user_name)) {
    friends.splice(friends.indexOf(currentUser.user_name), 1);
  } else {
    friends.push(currentUser.user_name);
  }
  targetUser.friends = JSON.stringify(friends);
  
  const result = await window.dataSdk.update(targetUser);
  if(result.isOk) {
    showToast(friends.includes(currentUser.user_name) ? 'Friend added!' : 'Friend removed');
    renderProfile(document.getElementById('tab-content'));
  }
}

        <button type="submit" id="cr-submit" class="w-full bg-accent text-white py-3 rounded-xl font-bold text-lg" style="background:linear-gradient(135deg,#ff964f,#ff6b2b)">Save Recipe</button>
      </form>

  `;
  lucide.createIcons();
}

async function saveRecipe(e) {
  e.preventDefault();
  if(allRecipes.length >= 999) { showToast('Storage limit reached!'); return; }
  const btn = document.getElementById('cr-submit');
  btn.disabled = true; btn.textContent = 'Saving...';
  
  const canPublish = currentUser.user_tier === 'cook' || currentUser.user_tier === 'expert';
  const pub = canPublish && document.getElementById('cr-publish')?.checked;
  
  // Handle photo
  let photoUrl = DEFAULT_AVATAR;
  const photoInput = document.getElementById('cr-photo');
  if(photoInput.files && photoInput.files[0]) {
    const reader = new FileReader();
    photoUrl = await new Promise((resolve) => {
      reader.onload = (e) => resolve(e.target.result);
      reader.readAsDataURL(photoInput.files[0]);
    });
  }

  const recipe = {
    type: 'recipe',
    title: document.getElementById('cr-title').value,
    description: document.getElementById('cr-desc').value,
    ingredients: document.getElementById('cr-ing').value.split('\n').join('|'),
    steps: document.getElementById('cr-steps').value.split('\n').join('|'),
    cook_time: parseInt(document.getElementById('cr-time').value)||30,
    category: document.getElementById('cr-cat').value,
    keywords: document.getElementById('cr-keywords').value,
    author: currentUser.user_name,
    author_tier: currentUser.user_tier,
    published: pub,
    comments: '[]',
    rating: 0,
    rating_count: 0,
    created_at: new Date().toISOString(),
    image_url: photoUrl
  };

  const result = await window.dataSdk.create(recipe);
  if(result.isOk) {
    closeModal();
    showToast(pub ? 'Recipe published!' : 'Recipe saved!');
  } else {
    btn.disabled = false; btn.textContent = 'Save Recipe';
    showToast('Failed to save recipe');
  }
}

async function publishRecipe(backendId) {
  const recipe = allRecipes.find(r=>r.__backendId===backendId);
  if(!recipe) return;

  const result = await window.dataSdk.update(recipe);
  if(result.isOk) {
    closeModal();
    showToast('Recipe published to Feed!');

let deleteConfirmId = null;
function confirmDelete(backendId) {
  deleteConfirmId = backendId;
  const btns = document.querySelector('.modal-sheet');
  const existing = document.getElementById('delete-confirm');
  if(existing) existing.remove();
  const div = document.createElement('div');
  div.id = 'delete-confirm';
  div.className = 'mt-4 p-4 bg-red-50 rounded-xl text-center';
  div.innerHTML = `
    <p class="font-semibold text-red-600 mb-3">Delete this recipe?</p>
    <div class="flex gap-2 justify-center">
      <button onclick="doDelete()" class="px-6 py-2 bg-red-500 text-white rounded-xl font-semibold">Delete</button>
      <button onclick="document.getElementById('delete-confirm').remove()" class="px-6 py-2 bg-gray-200 rounded-xl font-semibold">Cancel</button>
    </div>
  `;
  btns.appendChild(div);
}

async function doDelete() {
  const recipe = allRecipes.find(r=>r.__backendId===deleteConfirmId);
  if(!recipe) return;
  const result = await window.dataSdk.delete(recipe);
  if(result.isOk) { closeModal(); showToast('Recipe deleted'); }
  else showToast('Failed to delete');
}

async function addComment(backendId) {
  const input = document.getElementById('comment-input');
  const text = input?.value?.trim();
  if(!text) return;

  const recipe = allRecipes.find(r=>r.__backendId===backendId);
  if(!recipe) return;
  const comments = JSON.parse(recipe.comments||'[]');
  comments.push({user:currentUser.user_name,text,time:'just now'});
  recipe.comments = JSON.stringify(comments);
  const result = await window.dataSdk.update(recipe);
  if(result.isOk) { showRecipeDetail(recipe); showToast('Comment added!'); }
}

async function rateRecipe(stars, backendId) {
  const r = allRecipes.find(x=>x.__backendId===backendId);
  if(!r) return;
  const rc = r.rating_count||0;
  r.rating = ((r.rating*rc)+stars)/(rc+1);
  r.rating = Math.round(r.rating*10)/10;
  r.rating_count = rc+1;
  const result = await window.dataSdk.update(r);
  if(result.isOk) { showRecipeDetail(r); showToast(`Rated ${stars} stars!`); }
}

// ===== COOKING MODE =====
function startCooking(backendId) {
  const recipe = allRecipes.find(r=>r.__backendId===backendId);
  if(!recipe) return;

  closeModal();
  const ingredients = (recipe.ingredients||'').split('|').filter(Boolean);
  const steps = (recipe.steps||'').split('|').filter(Boolean);

  cookingState = { recipe, ingredients, steps, currentStep: -1, mode: null, started: false };
  showCookingModeSelect();
}

function showCookingModeSelect() {
  const el = document.getElementById('cooking-mode');
  el.style.display = 'flex';
  const r = cookingState.recipe;
  el.innerHTML = `
    <div class="flex-1 flex flex-col items-center justify-center p-6 text-center">
      <button onclick="exitCooking()" class="absolute top-5 right-5 w-10 h-10 rounded-full bg-white bg-opacity-20 flex items-center justify-center"><i data-lucide="x" style="width:22px;height:22px;color:#fff"></i></button>

      <h2 class="text-2xl font-bold mb-2 text-white" style="font-family:'Playfair Display',serif">${r.title}</h2>
      <p class="opacity-80 mb-8 text-white">Choose your cooking mode</p>
      <div class="w-full max-w-sm space-y-4">
        <button onclick="beginCooking('manual')" class="w-full p-5 rounded-2xl bg-white bg-opacity-20 text-left backdrop-blur-sm text-white">
          <div class="flex items-center gap-4">
            <span class="text-3xl">👆</span>
            <div>
              <p class="font-bold text-lg">Manual Cook</p>
              <p class="text-sm opacity-80">Tap "Next Step" to advance</p>
            </div>
          </div>
        </button>
        <button onclick="beginCooking('assisted')" class="w-full p-5 rounded-2xl bg-white bg-opacity-20 text-left backdrop-blur-sm text-white">
          <div class="flex items-center gap-4">
            <span class="text-3xl">🎙️</span>
            <div>
              <p class="font-bold text-lg">Assisted Cook</p>
              <p class="text-sm opacity-80">Voice reads steps aloud. Say "MakeMe, next"</p>
            </div>
          </div>
        </button>
      </div>
    </div>
  `;
  lucide.createIcons();
}

function beginCooking(mode) {
  cookingState.mode = mode;
  cookingState.currentStep = -1;
  cookingState.started = true;
  cookingStartTime = Date.now();
  showCookingStep();
}

function showCookingStep() {
  const el = document.getElementById('cooking-mode');
  const s = cookingState;
  const isIngredients = s.currentStep === -1;
  const isComplete = s.currentStep >= s.steps.length;
  const total = s.steps.length;

  if(isComplete) {
    const elapsed = Math.floor((Date.now()-cookingStartTime)/60000);
    const close = Math.abs(elapsed - s.recipe.cook_time) <= s.recipe.cook_time * 0.3;
    stopVoice();
    el.innerHTML = `
      <div class="flex-1 flex flex-col items-center justify-center p-6 text-center text-white">
        <div class="text-7xl mb-4">✨</div>
        <h2 class="text-3xl font-bold mb-2" style="font-family:'Playfair Display',serif">Done!</h2>
        <p class="opacity-80 text-lg mb-2">${s.recipe.title} is ready</p>
        <p class="opacity-60 text-sm mb-6">Cooked in ${elapsed} min${close?' — right on time!':''}</p>
        ${close ? '<p class="text-sm bg-white bg-opacity-20 rounded-xl p-3 mb-4">You nailed the timing!</p>' : ''}
        <button onclick="exitCooking()" class="px-8 py-4 bg-white text-orange-500 rounded-2xl font-bold text-lg shadow-lg">Finish</button>
      </div>
    `;
    return;
  }

  const progress = isIngredients ? 0 : ((s.currentStep+1)/total*100);

  el.innerHTML = `
    <div class="flex-1 flex flex-col p-5 text-white" style="position:relative">
      <div class="flex items-center justify-between mb-4">
        <button onclick="exitCooking()" class="w-10 h-10 rounded-full bg-white bg-opacity-20 flex items-center justify-center"><i data-lucide="x" style="width:20px;height:20px;color:#fff"></i></button>
        <div class="text-center">
          <p class="text-sm opacity-80 font-semibold">${isIngredients ? 'Ingredients' : `Step ${s.currentStep+1} of ${total}`}</p>
        </div>
        <div class="w-10"></div>
      </div>

      <!-- Progress bar -->
      <div class="w-full h-1.5 bg-white bg-opacity-20 rounded-full mb-6">
        <div class="h-full bg-white rounded-full transition-all duration-500" style="width:${progress}%"></div>
      </div>

      <div class="flex-1 flex flex-col items-center justify-center">
        ${isIngredients ? `
          <h3 class="text-xl font-bold mb-5" style="font-family:'Playfair Display',serif">Gather Your Ingredients</h3>
          <div class="step-card w-full max-w-md">
            <div class="space-y-3">
              ${s.ingredients.map(i=>`<div class="flex items-center gap-3"><span class="w-2 h-2 rounded-full bg-white flex-shrink-0"></span><span>${i.trim()}</span></div>`).join('')}
            </div>
          </div>
        ` : `
          <div class="step-card w-full max-w-md text-center">
            <div class="text-5xl mb-4">${s.currentStep===0?'🔥':s.currentStep===total-1?'🏁':'👨‍🍳'}</div>
            <p class="text-xl leading-relaxed">${s.steps[s.currentStep].trim()}</p>
          </div>
        `}
      </div>

      <div class="flex gap-3 mt-6 pb-4">
        ${s.currentStep > -1 ? `<button onclick="prevStep()" class="flex-1 py-4 rounded-2xl bg-white bg-opacity-20 font-bold text-lg">Back</button>` : ''}
        <button onclick="nextStep()" class="flex-1 py-4 rounded-2xl bg-white font-bold text-lg" style="color:#ff964f">
          ${isIngredients ? "Let's Cook!" : s.currentStep >= total-1 ? 'Finish' : 'Next Step'}
        </button>
      </div>

      ${s.mode==='assisted' ? `
      <div class="text-center pb-2">
        <div class="voice-pulse inline-flex items-center gap-2 bg-white bg-opacity-20 rounded-full px-4 py-2">
          <span class="w-3 h-3 rounded-full bg-white animate-pulse"></span>
          <span class="text-sm">Say "MakeMe, next" to advance</span>
        </div>
      </div>` : ''}
    </div>
  `;
  lucide.createIcons();

  if(s.mode === 'assisted') {
    const text = isIngredients
      ? 'Here are your ingredients: ' + s.ingredients.join(', ') + '. Say MakeMe next when you are ready.'
      : 'Step ' + (s.currentStep+1) + ': ' + s.steps[s.currentStep].trim();
    speakText(text);
    startVoiceRecognition();
  }
}

function nextStep() {
  cookingState.currentStep++;
  showCookingStep();
}

function prevStep() {
  if(cookingState.currentStep > -1) cookingState.currentStep--;
  showCookingStep();
}

function exitCooking() {
  stopVoice();
  stopVoiceRecognition();
  cookingState = null;
  document.getElementById('cooking-mode').style.display = 'none';
}

// ===== VOICE / SPEECH =====
function getVoiceParams() {
  const v = currentUser.voice || 'female-american';
  const parts = v.split('-');
  const gender = parts[0];
  const accent = parts[1];
  let lang = 'en-US';
  if(accent==='british') lang = 'en-GB';
  if(accent==='australian') lang = 'en-AU';
  return { gender, lang };
}

function speakText(text) {
  if(!speechSynth) return;
  stopVoice();
  const utt = new SpeechSynthesisUtterance(text);
  const { gender, lang } = getVoiceParams();
  utt.lang = lang;
  utt.rate = 0.9;
  utt.pitch = gender === 'female' ? 1.1 : 0.9;

  // Try to find a matching voice
  const voices = speechSynth.getVoices();
  const match = voices.find(v => v.lang.startsWith(lang.split('-')[0]) &&
    ((gender==='female' && v.name.toLowerCase().includes('female')) ||
     (gender==='male' && v.name.toLowerCase().includes('male'))));
  if(match) utt.voice = match;
  else {
    const langMatch = voices.find(v=>v.lang.startsWith(lang.split('-')[0]));
    if(langMatch) utt.voice = langMatch;
  }

  currentUtterance = utt;
  speechSynth.speak(utt);
}

function stopVoice() {
  if(speechSynth) speechSynth.cancel();
  currentUtterance = null;
}

function startVoiceRecognition() {
  stopVoiceRecognition();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  voiceRecognition = new SR();
  voiceRecognition.continuous = true;
  voiceRecognition.interimResults = false;
  voiceRecognition.lang = 'en-US';
  voiceRecognition.onresult = (e) => {
    const last = e.results[e.results.length-1];
    if(last.isFinal) {
      const transcript = last[0].transcript.toLowerCase().trim();
      if(transcript.includes('makeme') && (transcript.includes('next'))) {
        nextStep();
      }
    }
  };
  voiceRecognition.onerror = () => {};
  voiceRecognition.onend = () => {
    if(cookingState && cookingState.mode==='assisted') {
      try { voiceRecognition.start(); } catch(e){}
    }
  };
  try { voiceRecognition.start(); } catch(e){}
}

function stopVoiceRecognition() {
  if(voiceRecognition) {
    try { voiceRecognition.stop(); } catch(e){}
    voiceRecognition = null;
  }
}

// ===== MODAL =====
function closeModal() {
  document.getElementById('modal-overlay').style.display = 'none';
}

// ===== INIT =====
switchTab('home');
lucide.createIcons();

// Load voices
if(speechSynth) speechSynth.onvoiceschanged = () => speechSynth.getVoices();

// Initialize currentUser with default voice
currentUser = currentUser || { voice: 'female-american' };
